[project]
name = "fuel-hunter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.29.1",
    "alembic>=1.18.5",
    "celery>=5.6.3",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "psycopg>=3.3.4",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = [
    "mypy>=2.2.0",
    "ruff>=0.15.21",
]

[tool.ruff]
force-exclude = true
extend-exclude = [
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "src/migrations",
]

[tool.mypy]
explicit_package_bases = true
exclude = [
    "^\\.mypy_cache/",
    "^\\.ruff_cache/",
    "^\\.venv/",
    "^src/migrations/",
]
